app = "aimharder-bot"
# Fly deprecio la region de Madrid (mad); cdg (Paris) es la mas cercana.
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  TZ = "Europe/Madrid"

[http_service]
  internal_port = 8080
  force_https = true
  # El bot duerme dias enteros entre aperturas y no recibe trafico.
  # 'off' impide que Fly pare la maquina y mate el scheduler.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
